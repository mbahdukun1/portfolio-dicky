    <script>
      // Restore a deep link that a static host bounced through 404.html.
      (function () {
        try {
          var redirect = sessionStorage.getItem("dm-portfolio-redirect");
          if (redirect) {
            sessionStorage.removeItem("dm-portfolio-redirect");
            history.replaceState(null, "", redirect);
          }
        } catch (error) {}
      })();

      (function () {
        try {
          var stored = localStorage.getItem("dm-portfolio-theme");
          var prefersLight =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: light)").matches;
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : prefersLight
                ? "light"
                : "dark";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (error) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
