<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>Dicky Maulana — Software Engineer & Full Stack Developer</title>
    <meta
      name="description"
      content="Dicky Maulana — Software Engineer and Full Stack Developer based in Jakarta, Indonesia. Building scalable web, mobile, and integration systems with React, Node.js, and .NET." />
    <meta name="author" content="Dicky Maulana" />
    <meta
      name="theme-color"
      content="#0b0d10"
      media="(prefers-color-scheme: dark)" />
    <meta
      name="theme-color"
      content="#f1f2ef"
      media="(prefers-color-scheme: light)" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Dicky Maulana" />
    <meta property="og:locale" content="en_US" />
    <meta
      property="og:title"
      content="Dicky Maulana — Software Engineer & Full Stack Developer" />
    <meta
      property="og:description"
      content="Full stack engineer from Jakarta. Web, mobile, microservices, and system integration." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Dicky Maulana — Software Engineer and Full Stack Developer" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Dicky Maulana — Software Engineer & Full Stack Developer" />
    <meta
      name="twitter:description"
      content="Full stack engineer from Jakarta. Web, mobile, microservices, and system integration." />
    <meta name="twitter:image" content="/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet" />

    <script>
      // Restore a deep link that a static host bounced through 404.html.
      (function () {
        try {
          var redirect = sessionStorage.getItem("dm-portfolio-redirect");
          if (redirect) {
            sessionStorage.removeItem("dm-portfolio-redirect");
            history.replaceState(null, "", redirect);
          }
        } catch (error) {}
      })();

      (function () {
        try {
          var stored = localStorage.getItem("dm-portfolio-theme");
          var prefersLight =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: light)").matches;
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : prefersLight
                ? "light"
                : "dark";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (error) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
